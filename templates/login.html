<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Connexion - Suivi Famille</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
           height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; }
    form { background: #1e293b; padding: 2rem; border-radius: 12px; width: 280px; }
    h1 { font-size: 1.2rem; margin-top: 0; }
    input { width: 100%; padding: .6rem; margin: .5rem 0 1rem; border-radius: 6px;
            border: 1px solid #334155; background: #0f172a; color: #e2e8f0; box-sizing: border-box; }
    button { width: 100%; padding: .6rem; border: none; border-radius: 6px;
             background: #2563eb; color: white; font-weight: 600; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .error { color: #f87171; font-size: .9rem; margin-bottom: .5rem; }
  </style>
</head>
<body>
  <form method="post">
    <h1>Suivi Famille</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label>Mot de passe</label>
    <input type="password" name="password" autofocus required>
    <button type="submit">Se connecter</button>
  </form>
</body>
</html>
