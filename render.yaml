services:
  - type: web
    name: suivi-famille
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
    # Le plan gratuit n'a pas de disque persistant : suivi.db peut être
    # remis à zéro à chaque redéploiement. Pour garder l'historique,
    # passer à un plan payant et ajouter :
    # disk:
    #   name: data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
